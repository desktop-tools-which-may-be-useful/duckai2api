[workspace]
resolver = "2"
members = [
    "crates/duckai-types",
    "crates/duckai-protocol",
    "crates/duckai-upstream",
    "crates/duckai-api",
    "crates/duckai-webui",
    "crates/duckai-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["anonymous <anonymous@users.noreply.github.com>"]
repository = "https://github.com/desktop-tools-which-may-be-useful/duckai2api-rust"
description = "Duck.ai -> OpenAI/Anthropic/Responses API relay, rewritten in Rust"

[workspace.dependencies]
duckai-types = { path = "crates/duckai-types" }
duckai-protocol = { path = "crates/duckai-protocol" }
duckai-upstream = { path = "crates/duckai-upstream", default-features = false }
duckai-api = { path = "crates/duckai-api" }
duckai-webui = { path = "crates/duckai-webui" }

tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "socks", "rustls", "http2"] }
async-trait = "0.1"
eventsource-stream = "0.2"
futures = "0.3"
tokio-stream = "0.1"
rquickjs = { version = "0.14", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
rsa = { version = "0.9", features = ["sha2"] }
dashmap = "6.2"
rust-embed = "8.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
regex = "1"
bytes = "1"
http = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
chromiumoxide = "0.9"

# dev / test
wiremock = "0.6.5"
